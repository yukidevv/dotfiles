[colors]
[colors.primary]
background = '#1a1b26'
#background = '#000000'
foreground = '#a9b1d6'

# Normal colors
[colors.normal]
black = '#32344a'
red = '#f7768e'
green = '#9ece6a'
yellow = '#e0af68'
#blue = '#7aa2f7'
blue = '#6d8fd8'
magenta = '#ad8ee6'
cyan = '#449dab'
white = '#787c99'

# Bright colors
[colors.bright]
black = '#444b6a'
red = '#ff7a93'
green = '#b9f27c'
yellow = '#ff9e64'
blue = '#7da6ff'
magenta = '#bb9af7'
cyan = '#0db9d7'
white = '#acb0d0'

[colors.selection]
background = '#7aa2f7'

[font]
size = 12.0

[font.normal]
family = "PlemolJP"
style = "Regular"

[terminal.shell]
program = "C:\\Windows\\System32\\wsl.exe"
args = [
  "-d",
  "Ubuntu-24.04",
  "--cd",
  "~",
  "--",
  "bash",
  "-lc",
  "tmux new-session -A -s main"
]
